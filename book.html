<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书详情 - RAZ 精读记录</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="book-page">
<div id="app">
  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="brand-row">
      <a href="index.html" class="back-btn">← 返回书库</a>
      <div class="book-header">
        <span class="badge" id="book-level">AA</span>
        <h1 id="book-title">书名</h1>
        <span class="code" id="book-code"></span>
      </div>
    </div>
  </header>

  <!-- 主体两列布局 -->
  <main class="book-layout">
    <!-- 左侧：视频 -->
    <section class="video-pane">
      <div class="video-wrap" id="video-wrap">
        <video id="video-player" controls preload="metadata" playsinline></video>
      </div>
      <div class="video-tip">
        💡 视频播放完成后会自动标记为「已完成」· 控件中包含全屏按钮
      </div>

      <!-- 点赞 / 转发 / 评论 -->
      <div class="interact-card card">
        <div class="interact-bar">
          <button id="btn-like" class="interact-btn" title="点赞">
            <span class="icon">👍</span><span class="label" id="like-label">点赞</span><span class="count" id="like-count">0</span>
          </button>
          <button id="btn-forward" class="interact-btn" title="转发">
            <span class="icon">🔁</span><span class="label">转发</span><span class="count" id="forward-count">0</span>
          </button>
        </div>
        <div class="comment-section">
          <h3>💬 评论</h3>
          <div class="comment-input-row">
            <input type="text" id="comment-input" placeholder="写下你的评论..." maxlength="500" />
            <button id="comment-add" class="btn primary">发表</button>
          </div>
          <div id="comment-list"></div>
        </div>
      </div>
    </section>

    <!-- 右侧：记录 -->
    <aside class="record-pane">
      <!-- 完成状态卡片 -->
      <div class="card" id="completion-info"></div>

      <!-- 状态/评分 -->
      <div class="card">
        <h2>📊 阅读状态</h2>

        <div class="form-row">
          <label>状态:</label>
          <div id="status-wrap" style="flex:1">
            <select id="book-status" style="width:100%">
              <option value="unread">未读</option>
              <option value="reading">进行中</option>
            </select>
          </div>
          <div id="status-done-label" class="status done" style="display:none;padding:6px 10px">已完成</div>
        </div>
        <div class="form-row">
          <label>评分:</label>
          <div class="stars" id="book-stars">
            <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span>
            <span data-v="4">★</span><span data-v="5">★</span>
          </div>
        </div>
        <div class="form-row">
          <label>阅读次数:</label>
          <span id="book-plays" class="plays-val" style="font-size:14px;font-weight:600">0 次</span>
          <span class="plays-hint">(自动记录，完整播放一遍 +1)</span>
        </div>
        <div class="form-row">
          <label>掌握度:</label>
          <select id="book-mastery" style="width:100%">
            <option value="">未评定</option>
            <option value="1">生疏</option>
            <option value="2">一般</option>
            <option value="3">熟练</option>
            <option value="4">精通</option>
          </select>
        </div>
        <div class="form-row">
          <label>开始日期:</label>
          <input type="date" id="book-start" />
        </div>
      </div>

      <!-- 笔记 -->
      <div class="card">
        <h2>📝 笔记</h2>
        <textarea id="book-notes" rows="4" placeholder="生词、难点、表现、复习要点..."></textarea>
      </div>

      <!-- 历史记录 -->
      <div class="card">
        <h2>📜 阅读历史</h2>
        <div id="book-logs"></div>
      </div>
    </aside>
  </main>
</div>

<script src="app.js"></script>
<script src="book.js"></script>
</body>
</html>
