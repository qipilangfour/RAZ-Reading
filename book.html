<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书详情 - RAZ 精读记录</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="book-page">
<div id="app">
  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="brand-row">
      <a href="index.html" class="back-btn">← 返回书库</a>
      <div class="book-header">
        <span class="badge" id="book-level">AA</span>
        <h1 id="book-title">书名</h1>
        <span class="code" id="book-code"></span>
      </div>
    </div>
  </header>

  <!-- 主体两列布局 -->
  <main class="book-layout">
    <!-- 左侧：视频 -->
    <section class="video-pane">
      <div class="video-wrap" id="video-wrap">
        <video id="video-player" controls preload="metadata" playsinline></video>
      </div>
      <div class="video-tip">
        💡 视频播放完成后会自动标记为「已完成」· 控件中包含全屏按钮
      </div>
    </section>

    <!-- 右侧：记录 -->
    <aside class="record-pane">
      <!-- 完成状态卡片 -->
      <div class="card" id="completion-info"></div>

      <!-- 状态/评分 -->
      <div class="card">
        <h2>📊 阅读状态</h2>

        <div class="form-row">
          <label>状态:</label>
          <div id="status-wrap" style="flex:1">
            <select id="book-status" style="width:100%">
              <option value="unread">未读</option>
              <option value="reading">精读中</option>
              <option value="review">复习中</option>
              <option value="skipped">跳过</option>
            </select>
          </div>
          <div id="status-done-label" class="status done" style="display:none;padding:6px 10px">已完成</div>
        </div>
        <div class="form-row">
          <label>评分:</label>
          <div class="stars" id="book-stars">
            <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span>
            <span data-v="4">★</span><span data-v="5">★</span>
          </div>
        </div>
        <div class="form-row">
          <label>精读次数:</label>
          <input type="number" id="book-passes" min="1" max="20" value="3" />
        </div>
        <div class="form-row">
          <label>掌握度:</label>
          <input type="range" id="book-mastery" min="0" max="100" value="0" />
          <span id="mastery-val">0%</span>
        </div>
        <div class="form-row">
          <label>开始日期:</label>
          <input type="date" id="book-start" />
        </div>
      </div>

      <!-- 笔记 -->
      <div class="card">
        <h2>📝 笔记</h2>
        <textarea id="book-notes" rows="4" placeholder="生词、难点、表现、复习要点..."></textarea>
      </div>

      <!-- 添加精读记录 -->
      <div class="card">
        <h2>➕ 新增精读记录</h2>
        <div class="log-row">
          <input type="date" id="log-date" />
          <select id="log-status">
            <option value="read">精读一遍</option>
            <option value="review">复习一遍</option>
            <option value="test">听写/测试</option>
          </select>
        </div>
        <div class="log-row" style="margin-top:8px">
          <input type="text" id="log-note" placeholder="备注（可选）" style="flex:1" />
          <button id="log-add" class="btn primary">记录</button>
        </div>
      </div>

      <!-- 历史记录 -->
      <div class="card">
        <h2>📜 历史记录</h2>
        <div id="book-logs"></div>
      </div>
    </aside>
  </main>
</div>

<script src="app.js"></script>
<script src="book.js"></script>
</body>
</html>
